name: truncation-token-crash-tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run linked truncation token tests
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme TruncationTokenCrash-Package \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.5' \
            -only-testing:TruncationTokenCrashTests \
            CODE_SIGNING_ALLOWED=NO
